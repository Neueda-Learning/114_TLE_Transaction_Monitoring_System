spring.application.name=backend

# MySQL Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/transaction_monitoringdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:n3u3da!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=3

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.fetch_size=50

# JWT (dev-only secret; override via JWT_SECRET env var in real deployments)
app.jwt.secret=${JWT_SECRET:dev-only-change-this-super-secret-key-before-any-real-deployment}
app.jwt.expiration-ms=28800000

# Demo seed credentials for local/dev bootstrap. Override per environment.
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:admin123}
app.seed.analyst-password=${APP_SEED_ANALYST_PASSWORD:analyst123}

# Comma-separated frontend origins allowed by CORS (override per environment)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Simulator pace in seconds between generated transactions.
app.simulator.period-seconds=${SIMULATOR_PERIOD_SECONDS:5}
