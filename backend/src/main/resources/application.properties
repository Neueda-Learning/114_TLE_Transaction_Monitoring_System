spring.application.name=backend

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/transaction_monitoringdb
spring.datasource.username=root
spring.datasource.password=n3u3da!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT (dev-only secret; override via JWT_SECRET env var in real deployments)
app.jwt.secret=${JWT_SECRET:dev-only-change-this-super-secret-key-before-any-real-deployment}
app.jwt.expiration-ms=28800000

# Comma-separated frontend origins allowed by CORS (override per environment)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
